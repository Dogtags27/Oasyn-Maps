# AWS Amplify Hosting custom headers (monorepo format; must live at repo root).
#
# - index.html, sw.js and the manifest must always be revalidated, otherwise
#   returning visitors keep running an old build after a redeploy.
# - /assets/* files are content-hashed by Vite, so they can be cached forever.
applications:
  - appRoot: frontend
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'X-Frame-Options'
            value: 'SAMEORIGIN'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
      - pattern: '/index.html'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache'
      - pattern: '/sw.js'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache'
      - pattern: '/manifest.webmanifest'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache'
      - pattern: '/assets/**/*'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
